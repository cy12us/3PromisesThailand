<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>3PromisesThailand | Animated Three-Slide Homepage</title>
  <meta name="description" content="Three rotating 3PromisesThailand homepage slides with interactive controls.">
  <style>
    :root {
      --forest: #0c483b;
      --forest-dark: #0a3b31;
      --sage: #e1e9e1;
      --cream: #faf3ed;
      --warm: #f5e6d6;
      --bg: #fcf9f7;
      --radius: 22px;
      --font: 'Helvetica Neue', 'Helvetica', 'Inter', 'Nimbus Sans', Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      color: var(--forest-dark);
      font-family: var(--font);
      font-weight: 300;
      line-height: 1.35;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 35% 24% at 93% 22%, rgba(216, 155, 75, 0.30), transparent 77%),
        radial-gradient(ellipse 39% 40% at 98% 8%, rgba(50, 179, 166, .53), transparent 78%),
        radial-gradient(ellipse 24% 20% at 77% 19%, rgba(162, 222, 211, .25), transparent 88%),
        radial-gradient(ellipse 67% 58% at 30% 78%, rgba(247, 243, 242, .82), transparent 89%),
        var(--bg);
    }
    .page {
      width: min(100% - 64px, 1294px);
      margin: 0 auto;
      padding: 94px 0 76px;
    }
    .brand {
      display: block;
      width: clamp(420px, 51vw, 680px);
      max-width: 100%;
      height: auto;
      transform-origin: left center;
      animation: rise-in 850ms ease-out both;
    }
    /* The headline and rotating detail animate together on every slide. */
    .slide-headline {
      margin-top: 63px;
      animation: rise-in 950ms 130ms ease-out both;
    }
    .slide-headline h1 {
      font-weight: 200;
      font-size: clamp(29px, 3.25vw, 48px);
      line-height: 1.23;
      letter-spacing: -.045em;
      margin: 0;
      max-width: 1250px;
    }
    .changing {
      margin-top: 18px;
      height: 68px;
      display: flex;
      align-items: flex-start;
    }
    .changing-word {
      display: inline-block;
      font-weight: 250;
      font-size: clamp(24px, 2.36vw, 36px);
      letter-spacing: -.035em;
      line-height: 1.25;
      transition: opacity 330ms ease, transform 330ms ease;
      opacity: 1;
      transform: translateY(0);
      white-space: nowrap;
    }
    .changing-word.out {
      opacity: 0;
      transform: translateY(-8px);
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 15px 18px;
      margin: 187px 20px 0;
    }
    .tile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      border: 1px solid rgba(40, 65, 51, .03);
      border-radius: var(--radius);
      width: 100%;
      min-width: 0;
      color: var(--forest-dark);
      padding: 0 35px 0 46px;
      min-height: 102px;
      background: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 250;
      font-size: clamp(19px, 1.65vw, 25px);
      letter-spacing: -.033em;
      box-shadow: 0 4px 20px rgba(33, 54, 47, .035);
      transition: transform 270ms cubic-bezier(.2, .75, .2, 1),
                  box-shadow 270ms ease, filter 270ms ease;
      animation: tile-arrive 700ms cubic-bezier(.2,.75,.2,1) both;
    }
    .tile:focus-visible {
      outline: 3px solid #bf9457;
      outline-offset: 4px;
    }
    .tile:hover {
      transform: translateY(-5px);
      box-shadow: 0 13px 32px rgba(25, 56, 44, .11);
      filter: saturate(1.05);
    }
    .tile:active { transform: translateY(-1px); }
    .tile .arrow {
      font-size: 37px;
      line-height: 1;
      font-weight: 250;
      transition: transform 240ms ease;
      margin-left: 8px;
    }
    .tile:hover .arrow { transform: translateX(6px); }
    .tile:nth-child(1), .tile:nth-child(5) { grid-column: span 7; background: #e2eae1; }
    .tile:nth-child(2), .tile:nth-child(6) { grid-column: span 5; background: #0c5842; color: #f8f9f4; }
    .tile:nth-child(3) { grid-column: span 5; background: rgba(255, 253, 251, .86); }
    .tile:nth-child(4) { grid-column: span 7; background: #f8e8d8; }
    .tile:nth-child(1) { animation-delay: 380ms; }
    .tile:nth-child(2) { animation-delay: 465ms; }
    .tile:nth-child(3) { animation-delay: 550ms; }
    .tile:nth-child(4) { animation-delay: 635ms; }
    .tile:nth-child(5) { animation-delay: 720ms; }
    .tile:nth-child(6) { animation-delay: 805ms; }
    .tile:nth-child(n+3) { min-height: 91px; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes tile-arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Informational modal for the design preview; real pages are not yet linked. */
    dialog {
      color: var(--forest-dark);
      background: #fcfaf6;
      width: min(430px, calc(100vw - 32px));
      padding: 30px;
      border: 1px solid rgba(30, 75, 56, .15);
      border-radius: 20px;
      box-shadow: 0 25px 90px rgba(12, 50, 40, .23);
      font-family: var(--font);
    }
    dialog::backdrop { background: rgba(10, 35, 30, .38); backdrop-filter: blur(4px); }
    dialog h2 { margin: 0 0 12px; font-weight: 300; font-size: 27px; }
    dialog p { line-height: 1.6; font-size: 15px; color: #536760; }
    .modal-close {
      border: 0; border-radius: 100px; background: #0c5842;
      color: white; padding: 11px 24px; cursor: pointer;
      margin-top: 10px; font: 400 14px var(--font);
    }
    @media (min-width: 1000px) and (min-height: 1050px) {
      .bento-grid { margin-top: 160px; }
    }
    @media (max-width: 800px) {
      .page { width: calc(100% - 40px); padding-top: 64px; }
      .brand { width: min(100%, 540px); }
      .slide-headline { margin-top: 52px; }
      .changing { margin-top: 18px; height: 52px; }
      .bento-grid { margin: 131px 0 0; gap: 12px; }
      .tile { border-radius: 19px; padding: 0 21px; min-height: 100px; }
      .tile:nth-child(n+3) { min-height: 89px; }
      .tile .arrow { font-size: 29px; }
    }
    @media (max-width: 500px) {
      .page { padding: 42px 0 50px; }
      .brand { width: 100%; }
      .slide-headline { margin-top: 42px; }
      .slide-headline h1 { font-size: clamp(29px, 7.4vw, 38px); }
      .changing { margin-top: 17px; height: 56px; }
      .changing-word { font-size: 25px; white-space: normal; }
      .bento-grid { grid-template-columns: 1fr 1fr; margin-top: 108px; gap: 10px; }
      .tile { grid-column: auto !important; min-height: 100px !important; padding: 19px 17px; align-items: flex-end; font-size: 16px; line-height: 1.25; }
      .tile .arrow { font-size: 21px; align-self: flex-end; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important;
        transition-duration: .01ms !important; }
      .tile:hover { transform: none; }
    }

    /* Three rotating slides. Keep the existing layout and bento styling intact. */
    .slide-headline { position: relative; cursor: pointer; }
    .slide-copy {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 330ms ease, transform 330ms ease;
    }
    .slide-copy.is-switching {
      opacity: 0;
      transform: translateY(10px);
    }
    .slide-controls {
      position: absolute;
      right: 8px;
      bottom: 6px;
      display: flex;
      align-items: center;
      gap: 9px;
      z-index: 2;
    }
    .slide-count {
      color: #536d63;
      font: 400 11px var(--font);
      letter-spacing: .09em;
      margin-right: 6px;
      white-space: nowrap;
    }
    .slide-dot {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }
    .slide-dot::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid #6a8a7d;
      background: transparent;
      transition: background .2s ease, transform .2s ease;
    }
    .slide-dot[aria-current='true']::before {
      background: #0c5842;
      border-color: #0c5842;
      transform: scale(1.3);
    }
    .slide-dot:focus-visible { outline: 2px solid #bf9457; outline-offset: 2px; }
    .slide-tap-hint {
      position: absolute;
      right: 12px;
      bottom: -22px;
      font: 400 10px var(--font);
      letter-spacing: .03em;
      color: #667e73;
      white-space: nowrap;
      pointer-events: none;
    }
    @media (max-width: 800px) {
      .slide-controls { right: 0; bottom: -16px; }
      .slide-tap-hint { display: none; }
    }
    @media (max-width: 500px) {
      .slide-controls { right: 0; bottom: -25px; }
      .slide-count { font-size: 10px; }
      .slide-dot { width: 26px; height: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide-copy, .slide-dot::before { transition: none !important; }
      .slide-tap-hint { display: none; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      // Adjust this one number to control how long each slide remains on screen.
      const SLIDE_DURATION_MS = 20000;
      const WORD_DURATION_MS = 2740;
      const TRANSITION_MS = 330;
      const slides = [
        { name: 'Slide One', heading: 'Living abroad means your life is constantly changing.', prefix: 'your ' },
        { name: 'Slide Two', heading: 'If something happens to you, who will know', prefix: 'your ' },
        { name: 'Slide Three', heading: '3PromisesThailand keeps a record of', prefix: 'your ' }
      ];
      const phrases = [
        'address', 'phone number', 'friends', 'emergency contacts',
        'insurance', 'banking', 'important documents', 'wishes'
      ];
      const heading = document.getElementById('slide-heading');
      const word = document.getElementById('changing-word');
      const copy = document.getElementById('slide-copy');
      const region = document.getElementById('rotating-slide');
      const dots = [...document.querySelectorAll('.slide-dot')];
      const counter = document.getElementById('slide-count');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let slideIndex = 0;
      let wordIndex = 0;
      let slideTimer = null;
      let wordTimer = null;
      let transitionTimer = null;
      let isChanging = false;

      function currentPhrase() {
        return slides[slideIndex].prefix + phrases[wordIndex];
      }

      function setSlide(next, forced = false) {
        if (isChanging || next === slideIndex) {
          if (forced) scheduleSlide();
          return;
        }
        isChanging = true;
        clearTimeout(transitionTimer);
        clearTimeout(wordTimer);
        clearTimeout(slideTimer);
        const update = () => {
          slideIndex = (next + slides.length) % slides.length;
          heading.textContent = slides[slideIndex].heading;
          word.textContent = currentPhrase();
          word.classList.remove('out');
          region.setAttribute('aria-label', slides[slideIndex].name);
          dots.forEach((dot, index) => dot.setAttribute('aria-current', String(index === slideIndex)));
          counter.textContent = String(slideIndex + 1).padStart(2,'0') + ' / 03';
          copy.classList.remove('is-switching');
          isChanging = false;
          scheduleWord();
          scheduleSlide();
        };
        if (reduceMotion.matches) {
          update();
        } else {
          copy.classList.add('is-switching');
          transitionTimer = setTimeout(update, TRANSITION_MS);
        }
      }

      function nextSlide() {
        setSlide((slideIndex + 1) % slides.length, true);
      }

      function scheduleSlide() {
        clearTimeout(slideTimer);
        if (!document.hidden && !reduceMotion.matches) {
          slideTimer = setTimeout(nextSlide, SLIDE_DURATION_MS);
        }
      }

      function scheduleWord() {
        clearTimeout(wordTimer);
        if (document.hidden || reduceMotion.matches) return;
        wordTimer = setTimeout(() => {
          if (isChanging) return;
          word.classList.add('out');
          wordTimer = setTimeout(() => {
            wordIndex = (wordIndex + 1) % phrases.length;
            word.textContent = currentPhrase();
            word.classList.remove('out');
            scheduleWord();
          }, TRANSITION_MS);
        }, WORD_DURATION_MS);
      }

      // Click or tap anywhere except an interactive control to advance immediately.
      document.addEventListener('click', (event) => {
        if (document.getElementById('preview-dialog').open) return;
        if (event.target.closest('button, a, dialog, input, select, textarea')) return;
        nextSlide();
      });
      region.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
          event.preventDefault();
          setSlide(slideIndex + (event.key === 'ArrowRight' ? 1 : -1), true);
        }
      });
      dots.forEach(dot => {
        dot.addEventListener('click', event => {
          event.stopPropagation();
          setSlide(Number(dot.dataset.slide), true);
        });
      });
      document.addEventListener('keydown', event => {
        if (document.getElementById('preview-dialog').open) return;
        if (event.target.closest('button, input, textarea, select')) return;
        if (event.key === 'ArrowRight') setSlide(slideIndex + 1, true);
        if (event.key === 'ArrowLeft') setSlide(slideIndex - 1, true);
      });
      document.addEventListener('visibilitychange', () => {
        clearTimeout(slideTimer);
        clearTimeout(wordTimer);
        if (!document.hidden) {
          scheduleSlide();
          scheduleWord();
        }
      });
      if (reduceMotion.addEventListener) {
        reduceMotion.addEventListener('change', () => {
          clearTimeout(slideTimer);
          clearTimeout(wordTimer);
          if (!reduceMotion.matches) {
            scheduleSlide();
            scheduleWord();
          }
        });
      }
      scheduleSlide();
      scheduleWord();

      // Keep the bento cards unchanged from the approved preview.
      const modal = document.getElementById('preview-dialog');
      const title = document.getElementById('preview-title');
      document.querySelectorAll('.tile').forEach(tile => {
        tile.addEventListener('click', () => {
          title.textContent = tile.dataset.title;
          clearTimeout(slideTimer); // pause progression while modal is open
          if (modal.showModal) modal.showModal();
        });
      });
      modal.addEventListener('close', scheduleSlide);
    })();
  </script>
</body>
</html>
