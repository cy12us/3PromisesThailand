<p class="crumb">Customer Dashboard / Personal Information</p>
<h1>Personal Information</h1>
<p><a class="back" href="dashboard.html">← Back to Dashboard</a></p>

<div class="panel"><h3>Enter Personal Info</h3><div class="row"><div><label>Full legal name</label><input></div><div><label>Date of birth</label><input type="date"></div></div><label>Nationality / Passport number</label><input><label>Current address in Thailand</label><textarea rows="2"></textarea><label for="previous-address">Previous address in Thailand (add dates if known)</label><textarea id="previous-address" name="previous-address" rows="2"></textarea><label for="home-address">Home address / last address in home country (add dates if known)</label><textarea id="home-address" name="home-address" rows="2"></textarea></div>
<div class="action-row">
  <div class="action-main">
    <button type="button" id="save-personal-info" class="btn-save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg>
      Save
    </button>
  </div>
</div><div class="panel"><h3>Emergency Contacts</h3><label>Contact 1 - name, relationship, phone, email. The people you list here will be notified by email once your death has been verified. The notification will include the date and location of your death, if available, along with guidance on contacting your country's embassy or consulate in Thailand for further assistance.</label><textarea rows="2"></textarea>
<div class="action-row">
<div class="action-main">
<button type="button" class="btn-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg> Save</button>
<button type="button" class="btn-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Add Another</button>
</div>
<button type="button" class="btn-delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg> Delete</button>
</div></div>

<div class="panel"><h3>Preferred Representatives</h3><label>AList the people you would like to act on your behalf if necessary.

Provide their name, relationship, phone number, email address, and briefly describe what you would like them to do.

Important: Listing someone here expresses your wishes only. It does not grant them legal authority to act on your behalf. Any actions requiring legal authorization remain subject to applicable laws and documentation.</label><textarea rows="3"></textarea></div>

<div class="panel"><h3>Document Recipients</h3><label>Who should receive documents and copies</label><textarea rows="3"></textarea></div>

</div></main>
