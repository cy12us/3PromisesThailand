<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="app.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Information - Customer Dashboard</title>
<style>
body { font-family: "Helvetica Neue", Inter, sans-serif; margin:0; padding:40px; background:#fafaf8; color:#111; }
p.kicker { font-size:11px; color:#c96a2b; margin:0; }
h1 { font-size:32px; line-height:1.1; font-weight:500; margin:8px 0 0 0; }
.section { background:rgba(255,255,255,0.7); backdrop-filter:blur(10px); border:1px solid #eee; border-radius:12px; padding:20px; max-width:800px; margin-top:16px; }
.section h3 { margin:0 0 12px 0; font-size:18px; }
label { display:block; font-size:13px; margin:10px 0 4px 0; color:#333; }
input, textarea { width:100%; padding:10px; font-size:14px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
a.back { font-size:13px; color:#111; }
@media(max-width:700px){ .row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<p class="kicker">Customer Dashboard</p>
<h1>Personal Information</h1>
<p><a class="back" href="dashboard.html">← Back to Dashboard</a></p>
<div class="section"><h3>Enter Personal Info</h3><div class="row"><div><label>Full legal name</label><input></div><div><label>Date of birth</label><input type="date"></div></div><label>Nationality / Passport number</label><input><label>Current address in Thailand</label><textarea rows="2"></textarea></div>
<div class="section"><h3>Emergency Contacts</h3><label>Contact 1 - name, relationship, phone, email</label><textarea rows="2"></textarea><label>Contact 2 - name, relationship, phone, email</label><textarea rows="2"></textarea></div>
<div class="section"><h3>Authorized Reps</h3><label>Authorized representatives who may act on your behalf</label><textarea rows="3"></textarea></div>
<div class="section"><h3>Document Recipients</h3><label>Who should receive documents and copies</label><textarea rows="3"></textarea></div>
</body>
</html>
