<!-- personal-information.html -->
<!doctype html>
<html>
<head>
<link rel="stylesheet" href="app.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Information - Customer Dashboard</title>
<style>
body { background: #E0E8E1; }
</style>
</head>
<body>
<main class="page"><div class="wrap">
<p class="kicker">Customer Dashboard</p>
<h1>Personal Information</h1>
<p><a class="back" href="dashboard.html">← Back to Dashboard</a></p>

<div class="panel"><h3>Enter Personal Info</h3><div class="row"><div><label>Full legal name</label><input></div><div><label>Date of birth</label><input type="date"></div></div><label>Nationality / Passport number</label><input><label>Current address in Thailand</label><textarea rows="2"></textarea><label for="previous-address">Previous address in Thailand (if moved)</label><textarea id="previous-address" name="previous-address" rows="2"></textarea><label for="home-address">Home address / last address in home country</label><textarea id="home-address" name="home-address" rows="2"></textarea></div>
<div class="action-row">
  <div class="action-main">
    <button type="button" id="save-personal-info" class="btn-save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg>
      Save
    </button>
  </div>
</div>
<div class="panel"><h3>Emergency Contacts</h3><label>Contact 1 - name, relationship, phone, email</label><textarea rows="2"></textarea><label>Contact 2 - name, relationship, phone, email</label><textarea rows="2"></textarea></div>

<div class="panel"><h3>Authorized Reps</h3><label>Authorized representatives who may act on your behalf</label><textarea rows="3"></textarea></div>

<div class="panel"><h3>Document Recipients</h3><label>Who should receive documents and copies</label><textarea rows="3"></textarea></div>

</div></main>
</body>
</html>
